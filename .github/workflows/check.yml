name: SihtiBrainV2 controls
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Strict circuit controls
        run: python -m unittest discover -s tests -v
      - name: Reproduce plots and JSON
        run: python demo.py --output runs/first_echo
      - name: Reproduce apical learning and Gate 4 figure
        run: python demo_apical_credit.py --output runs/apical_credit --epochs 35
      - uses: actions/upload-artifact@v4
        with:
          name: sihtibrainv2-results-py${{ matrix.python-version }}
          path: |
            runs/first_echo/
            runs/apical_credit/
